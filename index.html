<style>
:root{color-scheme:light dark;--bg:light-dark(#f4f7f2,#0e1611);--card:light-dark(#fff,#17221a);--ink:light-dark(#13201a,#e5eee7);--mut:light-dark(#566659,#9aae9f);--line:light-dark(#d6e0d5,#2a3a2f);--leaf:light-dark(#23704a,#62c08b);--leafbg:light-dark(#e1f0e6,#1b3325);--vig:light-dark(#8f5a0f,#e3ac54);--vigbg:light-dark(#f7ead3,#3a2c14);--info:light-dark(#36607f,#93bad6);--infobg:light-dark(#e2ecf3,#1b2a36);--bad:light-dark(#a3261c,#f08a7e);--badbg:light-dark(#fbe3e0,#3d1a17);--pun:light-dark(#5b4a8b,#b9a8ec);--punbg:light-dark(#ece7fa,#2a2340);--comp:light-dark(#0f6b78,#6fd0dc);--compbg:light-dark(#dff2f4,#14343a);--band:var(--cc,#1c4a32);--cct:#f4f8f5;--hd:"Avenir Next","Segoe UI Variable Display","Segoe UI",Roboto,system-ui,sans-serif}

.pills{display:flex;gap:5px;flex-wrap:wrap}

.p1{background:var(--leafbg);color:var(--leaf)}.pv{background:var(--vigbg);color:var(--vig)}.p0{background:var(--infobg);color:var(--info)}.px{background:var(--badbg);color:var(--bad)}.pp{background:var(--punbg);color:var(--pun)}.pc{background:var(--compbg);color:var(--comp)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:9px 13px;font:inherit;font-size:15px;min-height:44px;text-align:left;display:inline-flex;align-items:center;gap:8px}
.chip i,.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.t1 i,.d1{background:var(--leaf)}.tv i,.dv{background:var(--vig)}.t0 i,.d0{background:var(--info)}.tx i,.dx{background:var(--bad)}.tp i,.dp{background:var(--pun)}.tc i,.dc{background:var(--comp)}
.chip.sug{border-color:var(--pun)}
.chip[aria-pressed=true]{border-color:var(--leaf);background:var(--leafbg);font-weight:700}
.fav .chip{font-size:16px;min-height:56px;padding:10px 14px;font-weight:600;flex:1 1 calc(50% - 8px)}
.burst{overflow-x:auto;flex-wrap:nowrap;padding-bottom:6px;margin-bottom:6px}.burst .chip{flex:none}
.sheetbg,.modalbg{position:fixed;inset:0;background:rgba(5,15,10,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modalbg{z-index:25}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:12px max(4vw,16px) calc(20px + env(safe-area-inset-bottom))}
@media(min-width:760px){.sheetbg,.modalbg{align-items:center}.sheet{border-radius:20px}}
.gl{font-size:14px;font-weight:700;color:var(--mut);margin:14px 0 8px}

details.more>summary{color:var(--leaf);margin-top:10px;border-top:1px solid var(--line);padding-top:6px}
details.memo>summary{color:var(--pun)}
details>summary::-webkit-details-marker{display:none}
details.more>summary::after{content:"▾";font-size:14px}details.more[open]>summary::after{content:"▴"}
details.memo ul{margin:6px 0 0;padding-left:20px;font-size:14px}details.memo li{margin:4px 0}
.btn{border:0;border-radius:12px;padding:10px 16px;font:inherit;font-weight:700;min-height:44px;background:var(--leaf);color:var(--bg)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn:disabled{opacity:.5}
.x{border:0;background:none;color:var(--mut);font-size:24px;line-height:1;min-width:44px;min-height:44px;flex:none}
input,textarea,select{font:inherit;font-size:16px;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-height:44px}
input[type=time]{width:auto}
textarea{min-height:110px;resize:vertical;line-height:1.45}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nw{flex-wrap:nowrap}.sb{justify-content:space-between}

.ses b{font:700 17px var(--hd)}
.list{list-style:none;margin:0;padding:0}

.toast[hidden]{display:none}
.toast button{background:none;border:0;color:var(--bg);font:inherit;font-weight:700;text-decoration:underline;min-height:40px;padding:0 8px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) 2.4em;gap:4px 10px;align-items:center;margin:10px 0}
.bars .lab{font-size:15px;display:flex;gap:8px;align-items:center}
.bars .tr{grid-column:1;height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bars .tr span{display:block;height:100%;border-radius:99px}
.bars .n{grid-row:1/3;grid-column:2;text-align:right;font:700 20px var(--hd)}
.cgrp{border-top:1px solid var(--line);padding:10px 0}.cgrp:first-of-type{border-top:0;padding-top:0}
.cgrp b{display:block;font-size:15px}
table{width:100%;border-collapse:collapse}
th,td{padding:7px 5px;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
th{font-size:13px;color:var(--mut);font-weight:700}
tr:last-child td{border-bottom:0}
.r{text-align:right}
.lnk{background:none;border:0;font:inherit;font-weight:700;color:var(--ink);text-align:left;padding:6px 0;min-height:40px;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.empty{text-align:center;padding:24px 16px 40px;color:var(--mut);max-width:520px;margin:0 auto}

.kpi b{display:block;font:700 clamp(24px,6vw,32px)/1 var(--hd)}
.kpi span{font-size:13px;color:var(--mut)}
.small{font-size:14px;color:var(--mut);margin:6px 0 0}
.err{color:var(--bad);font-weight:700;min-height:1.5em;margin:10px 0 0}
.behrow{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;gap:6px 8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}

.star[aria-pressed=true]{color:#d99a00}
.pre{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}.pre .chip{flex:none;min-height:40px;padding:7px 12px}
.auth{max-width:420px;margin:0 auto;padding:calc(28px + env(safe-area-inset-top)) 18px 40px}
.auth .brand{display:flex;gap:12px;align-items:center;margin-bottom:18px}
.auth .brand svg{width:52px;height:52px;flex:none}
.auth .brand b{font:700 24px/1.1 var(--hd)}
.pin{font-size:28px;letter-spacing:.4em;text-align:center}
.warnbox{background:var(--vigbg);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;margin:14px 0}
.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--vigbg);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-size:14px}
.swatches{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.cal .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center}.cal .dots i{width:8px;height:8px;border-radius:50%;display:block}
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.calhead b{font:700 19px var(--hd);text-transform:capitalize}
.chrono{font:700 clamp(30px,8vw,44px)/1 var(--hd);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.hchrono{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;padding:4px 11px;border-radius:99px;background:color-mix(in srgb,var(--cct) 22%,transparent);white-space:nowrap}
.hchrono[hidden]{display:none}
.startcard{border-left:5px solid var(--band)}
.startcard .btn{font-size:17px;min-height:54px;padding:12px 18px}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch input{width:auto;min-height:0;transform:scale(1.4)}
</style>
</head>
<body class="locked">

<script>
{
/* ================= outils ================= */
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

const te=new TextEncoder(),td=new TextDecoder(),ITER=250000;
const b64=u=>{const a=new Uint8Array(u);let s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode.apply(null,a.subarray(i,i+32768));return btoa(s)};
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function pbk(secret,salt,iter,extractable){const km=await crypto.subtle.importKey('raw',te.encode(secret),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',hash:'SHA-256',salt,iterations:iter},km,{name:'AES-GCM',length:256},extractable,['encrypt','decrypt'])}
const derive=(id,pw,salt,iter)=>pbk(id.trim().toLowerCase()+'\u0000'+pw,salt,iter,true);
async function enc(key,bytes){const iv=crypto.getRandomValues(new Uint8Array(12));return{iv:b64(iv),ct:b64(await crypto.subtle.encrypt({name:'AES-GCM',iv},key,bytes))}}
const dec=(key,o)=>crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.ct));
async function seal(k,obj){const e=await enc(k.key,te.encode(JSON.stringify(obj)));return{app:'carnet-svt',v:1,salt:b64(k.salt),iter:k.iter,...e,saved:Date.now()}}
async function openWith(rec,key){return JSON.parse(td.decode(await dec(key,rec)))}
async function unseal(rec,id,pw){const salt=ub64(rec.salt),key=await derive(id,pw,salt,rec.iter);const data=await openWith(rec,key);return{k:{key,salt,iter:rec.iter},data}}
const idb=(()=>{let p;const o=()=>p||(p=new Promise((res,rej)=>{const r=indexedDB.open('carnet-svt',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
 const tx=(m,f)=>o().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv',m),q=f(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));
 return{get:k=>tx('readonly',s=>s.get(k)),set:(k,v)=>tx('readwrite',s=>{s.put(v,k)}),del:k=>tx('readwrite',s=>{s.delete(k)})}})();

 const comp=top(b=>b.ax==='comp',2),att=top(b=>b.v===1&&b.ax!=='comp',1),V=top(b=>b.v<0,2,2);
 const neg=Object.entries(g).filter(([b,n])=>bm[b].v<0&&n>=2).reduce((s,[b,n])=>s+n*(bm[b].v===-2?2:1),0),n=Math.max(nSes||0,1),rate=neg/n,few=(nSes||0)<3;

 let s=few?(P.length?'Bon trimestre':'Trimestre correct dans l\'ensemble'):rate<0.2?(P.length>=2?'Très bon trimestre':'Bon trimestre'):rate<0.5?'Trimestre satisfaisant dans l\'ensemble':rate<1?'Trimestre encourageant':'Trimestre à consolider';
 s+=P.length?', marqué par '+join(P)+'.':'.';
 if(V.length){const j=join(V);s+=' Pour progresser encore, il convient '+(/^[aeiouyéèêâîôûh]/i.test(j)?'d\'':'de ')+j+'.'}

function sesSummary(se){if(!se)return '';const c=S.classes.find(x=>x.id===se.c);if(!c)return '';const lv=c.lv;

 const sec=(title,f,fmt)=>{const by={};l.filter(f).forEach(e=>(by[e.s]=by[e.s]||[]).push(e));const k=c.students.filter(s=>by[s.id]);if(!k.length)return false;out.push('');out.push(title);k.forEach(s=>out.push('- '+s.n+' : '+by[s.id].map(fmt).join(', ')));return true};

async function unzip(buf){const dv=new DataView(buf);let e=buf.byteLength-22;while(e>=0&&dv.getUint32(e,true)!==0x06054b50)e--;if(e<0)throw new Error('zip');
 const n=dv.getUint16(e+10,true),files={};let p=dv.getUint32(e+16,true);
 for(let i=0;i<n;i++){if(dv.getUint32(p,true)!==0x02014b50)break;const meth=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),off=dv.getUint32(p+42,true);
  files[td.decode(new Uint8Array(buf,p+46,nl))]={meth,csz,off};p+=46+nl+xl+cl}
 return{names:Object.keys(files),async read(name){const f=files[name];if(!f)return null;const ln=dv.getUint16(f.off+26,true),lx=dv.getUint16(f.off+28,true),d=new Uint8Array(buf,f.off+30+ln+lx,f.csz);
  if(f.meth===0)return td.decode(d);return await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text()}}}
const xml=s=>new DOMParser().parseFromString(s,'application/xml');
const tags=(n,t)=>[...n.getElementsByTagNameNS('*',t)];
const colIdx=r=>{const m=/^[A-Z]+/.exec(r||'');let n=0;if(!m)return -1;for(const ch of m[0])n=n*26+ch.charCodeAt(0)-64;return n-1};
async function readRows(file){const name=file.name.toLowerCase();
 if(/\.(csv|txt)$/.test(name)){const t=(await file.text()).replace(/^﻿/,'');const h=t.split('\n')[0];const sep=h.includes(';')?';':h.includes('\t')?'\t':',';return t.split(/\r?\n/).map(r=>r.split(sep).map(x=>x.replace(/^"|"$/g,'').trim()))}
 const z=await unzip(await file.arrayBuffer());
 if(z.names.includes('content.xml')){const d=xml(await z.read('content.xml'));const tb=tags(d,'table')[0];if(!tb)return[];
  return tags(tb,'table-row').map(r=>{const o=[];for(const c of [...r.children]){if(c.localName!=='table-cell'&&c.localName!=='covered-table-cell')continue;const rep=Math.min(+(c.getAttribute('table:number-columns-repeated')||1),50);const v=tags(c,'p').map(x=>x.textContent).join(' ').trim();for(let i=0;i<rep;i++)o.push(v)}return o})}
 const ss=[];const sx=await z.read('xl/sharedStrings.xml');if(sx)tags(xml(sx),'si').forEach(si=>ss.push(tags(si,'t').map(t=>t.textContent).join('')));
 const sh=z.names.filter(x=>/^xl\/worksheets\/sheet\d+\.xml$/.test(x)).sort((a,b)=>parseInt(a.match(/\d+/))-parseInt(b.match(/\d+/)))[0];if(!sh)throw new Error('sheet');
 return tags(xml(await z.read(sh)),'row').map(r=>{const o=[];tags(r,'c').forEach((c,i)=>{const ix=colIdx(c.getAttribute('r'));const t=c.getAttribute('t');let v;
  if(t==='s')v=ss[+((tags(c,'v')[0]||{}).textContent)]||'';else if(t==='inlineStr')v=tags(c,'t').map(x=>x.textContent).join('');else v=(tags(c,'v')[0]||{}).textContent||'';o[ix<0?i:ix]=String(v).trim()});return Array.from(o,x=>x||'')})}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,' ').trim();
function rowsToNames(rows){rows=rows.filter(r=>r.some(x=>String(x||'').trim()));if(!rows.length)return[];
 let hi=-1,cn=-1,cp=-1,cf=-1;
 for(let i=0;i<Math.min(rows.length,6)&&hi<0;i++){rows[i].forEach((v,j)=>{const x=norm(v);if(/^prenom/.test(x))cp=j;else if(x==='nom'||/^nom\b/.test(x)&&!/prenom/.test(x))cn=j;else if(x==='eleve'||x==='eleves'||/nom.*prenom/.test(x))cf=j});if(cn>=0||cp>=0||cf>=0)hi=i}
 const data=rows.slice(hi+1);
 if(cn>=0&&cp>=0)return data.map(r=>[(r[cp]||'').trim(),(r[cn]||'').trim()].filter(Boolean).join(' ')).filter(Boolean);
 if(cf>=0)return data.map(r=>(r[cf]||'').trim()).filter(Boolean);
 if(cn>=0)return data.map(r=>(r[cn]||'').trim()).filter(Boolean);
 return data.map(r=>r[1]?(String(r[1]).trim()+' '+String(r[0]).trim()).trim():String(r[0]).trim()).filter(Boolean)}

 try{const f=new File([blob],name,{type});if(navigator.canShare&&navigator.canShare({files:[f]})&&matchMedia('(pointer:coarse)').matches){await navigator.share({files:[f],title:name});return true}}catch(e){if(e&&e.name==='AbortError')return false}
 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);return true}

 case'cancel':ui.edit=null;ui.confirm=false;break;
 case'col':{const i=$('#ccol');if(i)i.value=t.dataset.c;document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b===t));setColor({col:t.dataset.c});return}
 case'xlpick':$('#xlIn').value='';$('#xlIn').click();return;
 case'savecls':saveClass();return;
 case'delcls':if(!ui.confirm){ui.confirm=true;break}delClass();return;
 case'star':{const b=ui.behEdit[+t.dataset.i];if(b)b.f=!b.f;break}
 case'behadd':ui.behEdit.push({id:uid(),l:'',v:1,ap:'',ax:'att'});sched(true);setTimeout(()=>{const x=document.querySelectorAll('.behrow input[data-f=l]');x[x.length-1]&&x[x.length-1].focus()},0);return;
 case'behdel':ui.behEdit.splice(+t.dataset.i,1);break;
 case'behreset':ui.behEdit=(DEFL()[ui.behLv]||DEFL().autre).map(b=>({...b}));break;
 case'behsave':S.lists[ui.behLv]=ui.behEdit.filter(b=>String(b.l).trim()).map(b=>({...b,l:String(b.l).trim()}));ui.behEdit=null;save();toast('Liste '+lvName(ui.behLv)+' enregistrée.');break;
 case'punadd':ui.punEdit.push({id:uid(),l:''});sched(true);return;
 case'pundel':ui.punEdit.splice(+t.dataset.i,1);break;
 case'punreset':ui.punEdit=PUNDEF.map(x=>({...x}));break;
 case'punsave':S.pun=ui.punEdit.filter(x=>String(x.l).trim()).map(x=>({...x,l:String(x.l).trim()}));ui.punEdit=null;save();toast('Punitions enregistrées.');break;
 case'pinoff':delete S.prefs.pin;await idb.del('pin');save();toast('Code désactivé : le mot de passe sera demandé.');break;
 case'yearwipe':if(ui.yearStep!==1){ui.yearStep=1;break}S.logs=[];S.sessions=[];S.notes={};ui.yearStep=0;save();toast('Données de l\'année effacées.');break;
 case'yearcancel':ui.yearStep=0;break;
 case'backup':backup();return;
 case'filelink':linkFile();return;
 case'fileperm':try{fileOK=(await fileH.requestPermission({mode:'readwrite'}))==='granted';if(fileOK)await doSave()}catch(e){fileOK=false}break;
 case'imppick':$('#fileIn').value='';$('#fileIn').click();return;
 case'csv':await giveFile('carnet-svt-'+ymd(Date.now())+'.csv','﻿'+csv(),'text/csv');return;
 }
 sched(true)});
$('#xlIn').addEventListener('change',async()=>{const f=$('#xlIn').files[0];if(!f)return;const st=$('#xlst');
 try{const names=rowsToNames(await readRows(f));if(!names.length)throw 0;$('#cs').value=names.join('\n');if(st)st.textContent=names.length+' élèves importés depuis '+f.name;toast(names.length+' élèves importés : vérifiez puis enregistrez.')}
 catch(e){if(st)st.textContent='Lecture impossible : enregistrez le fichier en .xlsx, .ods ou .csv.';toast('Fichier illisible.')}});
$('#fileIn').addEventListener('change',async()=>{const f=$('#fileIn').files[0];if(!f)return;
 try{const rec=JSON.parse(await f.text());if(!rec||rec.app!=='carnet-svt'||!rec.ct)throw 0;
  if(S){clearTimeout(saveT);await doSave()}pendingImport=rec;K=null;S=null;ui.err='';ui.auth=(await idb.get('vault'))?'login':'setup';render(true);
  toast('Saisissez les identifiants de la sauvegarde pour la restaurer.')}
 catch(e){toast('Ce fichier n\'est pas une sauvegarde du Carnet SVT.')}});
document.addEventListener('input',ev=>{const t=ev.target;if(!S)return;
 if(t.id==='appr'){clearTimeout(apT);apT=setTimeout(saveAppr,600)}
 else if(t.dataset.pf&&ui.punEdit){const x=ui.punEdit[+t.dataset.i];if(x)x.l=t.value}
 else if(t.dataset.f&&ui.behEdit){const b=ui.behEdit[+t.dataset.i];if(!b)return;const f=t.dataset.f;
  if(f==='type'){if(t.value==='c'){b.ax='comp';b.v=1;b.cp=b.cp||'dem'}else{b.ax='att';b.v=+t.value;delete b.cp}sched(true)}else if(f==='cp')b.cp=t.value;else b[f]=t.value}});
document.addEventListener('change',ev=>{const t=ev.target;if(!S)return;
 if(t.id==='from'||t.id==='to'){ui[t.id]=t.value;save();sched(true)}
 else if(t.id==='blv'){ui.behLv=t.value;ui.behEdit=null;sched(true)}
 else if(t.id==='ccol'){document.querySelectorAll('.sw').forEach(b=>b.setAttribute('aria-pressed',b.dataset.c===t.value));setColor({col:t.value})}
 else if(t.id==='autoClose'||t.id==='vib'){S.prefs[t.id]=t.checked;save()}
 else if(t.id==='prof'){S.prefs.prof=t.value.trim();save()}
 else if(t.id==='snote'&&ui.ses){const x=S.sessions.find(y=>y.id===ui.ses);if(x){x.note=t.value.trim();save();sched(true)}}
 else if((t.id==='ss'||t.id==='se')&&ui.ses){const x=S.sessions.find(y=>y.id===ui.ses);if(!x)return;const v=atTime(x.start,t.value);
  if(t.id==='ss'&&v)x.start=v;else if(t.id==='se')x.end=v&&v>x.start?v:(t.value?x.end:null);save();sched(true)}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(ui.modal){ui.modal=null;sched(true)}else if(ui.sheet){ui.sheet=null;ui.sheetSe=null;sched(true)}}if(ev.key==='Enter'&&ev.target.id==='note'){ev.preventDefault();$('[data-act=note]').click()}});

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
(async()=>{try{META=(await idb.get('meta'))||{};fileH=(await idb.get('fileH'))||null;ui.auth=(await idb.get('vault'))?((await pinValid())?'pin':'login'):'setup'}catch(e){ui.auth='setup'}render(true)})();
}
</script>
</body>
</html>

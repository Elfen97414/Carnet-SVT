:root{--bg:light-dark(#f4f7f2,#0e1611);--card:light-dark(#fff,#17221a);--ink:light-dark(#13201a,#e5eee7);--mut:light-dark(#566659,#9aae9f);--line:light-dark(#d6e0d5,#2a3a2f);--leaf:light-dark(#23704a,#62c08b);--leafbg:light-dark(#e1f0e6,#1b3325);--vig:light-dark(#8f5a0f,#e3ac54);--vigbg:light-dark(#f7ead3,#3a2c14);--info:light-dark(#36607f,#93bad6);--infobg:light-dark(#e2ecf3,#1b2a36);--bad:light-dark(#a3261c,#f08a7e);--badbg:light-dark(#fbe3e0,#3d1a17);--pun:light-dark(#5b4a8b,#b9a8ec);--punbg:light-dark(#ece7fa,#2a2340);--comp:light-dark(#0f6b78,#6fd0dc);--compbg:light-dark(#dff2f4,#14343a);--band:var(--cc,#1c4a32);--cct:#f4f8f5;--hd:"Avenir Next","Segoe UI Variable Display","Segoe UI",Roboto,system-ui,sans-serif}

 const tx=(m,f)=>o().then(d=>new Promise((res,rej)=>{const t=d.transaction('kv',m),q=f(t.objectStore('kv'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)}));

/* ================= textes ================= */
const join=a=>a.length>1?a.slice(0,-1).join(', ')+' et '+a[a.length-1]:a[0]||'';
function draft(l,lv,nSes){const bm=bmap(lv),g={};l.forEach(e=>{if(bm[e.b])g[e.b]=(g[e.b]||0)+1});
 const top=(f,k,min)=>Object.entries(g).filter(([b,n])=>f(bm[b])&&bm[b].ap&&n>=(min||1)).sort((a,b)=>b[1]-a[1]).slice(0,k).map(([b])=>bm[b].ap);
 const comp=top(b=>b.ax==='comp',2),att=top(b=>b.v===1&&b.ax!=='comp',1),V=top(b=>b.v<0,2,2);
 const neg=Object.entries(g).filter(([b,n])=>bm[b].v<0&&n>=2).reduce((s,[b,n])=>s+n*(bm[b].v===-2?2:1),0),n=Math.max(nSes||0,1),rate=neg/n,few=(nSes||0)<3;
 const P=[...comp,...att].slice(0,2);
 let s=few?(P.length?'Bon trimestre':'Trimestre correct dans l\'ensemble'):rate<0.2?(P.length>=2?'Très bon trimestre':'Bon trimestre'):rate<0.5?'Trimestre satisfaisant dans l\'ensemble':rate<1?'Trimestre encourageant':'Trimestre à consolider';
 s+=P.length?', marqué par '+join(P)+'.':'.';
 if(V.length){const j=join(V);s+=' Pour progresser encore, il convient '+(/^[aeiouyéèêâîôûh]/i.test(j)?'d\'':'de ')+j+'.'}
 return s+(rate<0.5?' Continuez ainsi !':' Les efforts doivent se poursuivre, courage !')}
function draftFor(c,sid){const l=S.logs.filter(e=>e.c===c.id&&e.s===sid&&inPeriod(e.t)),abs=new Set(l.filter(e=>e.b==='abs').map(e=>e.se)),ns=S.sessions.filter(x=>x.c===c.id&&inPeriod(x.start)&&!abs.has(x.id)).length;return draft(l,c.lv,ns)}
function sesSummary(se){if(!se)return '';const c=S.classes.find(x=>x.id===se.c);if(!c)return '';const lv=c.lv;
 const l=S.logs.filter(e=>e.se===se.id).sort((a,b)=>a.t-b.t),out=[];
 out.push('Séance du '+dlong(se.start)+' · '+c.name+' ('+lvName(lv)+')');out.push('Horaires : '+sesRange(se));if(se.seq)out.push('Séquence : '+seqLabel(se));
 const abs=[...new Set(l.filter(e=>e.b==='abs').map(e=>(stuOf(c,e.s)||{}).n||'?'))];
 out.push('Effectif : '+c.students.length+' élèves'+(abs.length?' · Absents ('+abs.length+') : '+abs.join(', '):' · Aucun absent noté'));
 const sec=(title,f,fmt)=>{const by={};l.filter(f).forEach(e=>(by[e.s]=by[e.s]||[]).push(e));const k=c.students.filter(s=>by[s.id]);if(!k.length)return false;out.push('');out.push(title);k.forEach(s=>out.push('- '+s.n+' : '+by[s.id].map(fmt).join(', ')));return true};
 sec('Réussites en SVT',e=>kind(e.b,lv)==='c',e=>bl(e.b,lv));
 sec('Points forts remarquables',e=>kind(e.b,lv)==='1',e=>bl(e.b,lv));
 sec('À accompagner',e=>kind(e.b,lv)==='v',e=>bl(e.b,lv));
 if(!sec('Comportements inappropriés',e=>kind(e.b,lv)==='x',e=>bl(e.b,lv)+' ('+hm(e.t)+')')){out.push('');out.push('Aucun comportement inapproprié relevé.')}
 sec('Punitions données',e=>e.b==='pun',e=>punL(e.p)+(e.done?' (faite)':' (à vérifier)'));
 sec('Informations',e=>bv(e.b,lv)===0&&e.b!=='abs',e=>bl(e.b,lv));
 sec('Notes',e=>e.b==='note',e=>e.n);
 if(se.peda){out.splice(se.seq?3:2,0,'Contenu : '+se.peda)}
 const hi=hwInfo(se);if(hi){const sm=Object.fromEntries(c.students.map(s=>[s.id,s.n])),nos=Object.entries((se.hwc&&se.hwc.st)||{}).filter(([k,v])=>v==='no').map(([k])=>sm[k]||'?');out.push('');out.push('Travail à rendre'+(hi.p.hw?' ('+hi.p.hw+')':'')+' : '+hi.ok+' rendu(s), '+hi.no+' non rendu(s)'+(nos.length?' : '+nos.join(', '):''))}
 if(se.todo){out.push('');out.push('Reste à faire : '+se.todo)}
 if(se.hwOn){out.push('Travail donné pour la prochaine séance : '+(se.hw||'oui'))}
 if(se.note){out.push('');out.push('Remarque générale : '+se.note)}
 return out.join('\n')}
function csv(){const rows=[['Classe','Niveau','Élève','Date','Début séance','Fin séance','Séquence','Contenu de la séance','Heure','Observation','Type','Compétence','Note / suivi']];
 for(const c of S.classes){const sm=Object.fromEntries(c.students.map(s=>[s.id,s.n])),se=Object.fromEntries(S.sessions.map(x=>[x.id,x])),bm=bmap(c.lv);
  for(const e of S.logs.filter(e=>e.c===c.id).sort((a,b)=>a.t-b.t)){const x=se[e.se],k=kind(e.b,c.lv);rows.push([c.name,lvName(c.lv),sm[e.s]||'(élève retiré)',ymd(e.t),x?hm(x.start):'',x&&x.end?hm(x.end):'',x?seqLabel(x):'',x&&x.peda||'',hm(e.t),elabel(e,c.lv),e.b==='note'?'Note':e.b==='pun'?'Punition':TYP[k==='c'?'c':String(bv(e.b,c.lv))]||'',k==='c'?COMP[(bm[e.b]||{}).cp]||'':'',e.b==='pun'?(e.done?'faite':'à vérifier'):e.n||''])}}

  if(t.id==='ss'&&v)x.start=v;else if(t.id==='se')x.end=v&&v>x.start?v:(t.value?x.end:null);save();later()}});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'){if(ui.modal){ui.modal=null;sched(true)}else if(ui.sheet){ui.sheet=null;ui.sheetSe=null;sched(true)}}if(ev.key==='Enter'&&ev.target.id==='note'){ev.preventDefault();$('[data-act=note]').click()}});

if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

}
